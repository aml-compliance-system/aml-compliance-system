<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening AI Assistant · FINDETECT</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="content" style="max-width:720px;margin:80px auto">
    <div class="card">
      <div class="card-title">Opening the AI Assistant</div>
      <p class="small muted" style="margin-top:8px" id="message">Resolving the selected case…</p>
      <div id="action" style="margin-top:12px"></div>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const caseId = params.get("case_id") || sessionStorage.getItem("active_case_id") || "";
      const runId = params.get("run") || "";
      const message = document.getElementById("message");
      const action = document.getElementById("action");
      if (caseId && caseId !== "UNKNOWN-CASE" && caseId.indexOf("CASE-") === 0) {
        const query = new URLSearchParams({ case_id: caseId });
        if (runId) query.set("run", runId);
        window.location.replace("assistant.html?" + query.toString());
      } else if (caseId && caseId !== "UNKNOWN-CASE") {
        // Legacy account-only session: the case queue is the source of truth for account/day selection.
        message.textContent = "This legacy chat link has no account/day case id. Select the case from the queue to use the assisted investigator.";
        action.innerHTML = '<a class="btn" href="index.html">Open case queue</a>';
      } else {
        message.textContent = "No case is selected. The AI assistant must be opened from a real case.";
        action.innerHTML = '<a class="btn" href="index.html">Open case queue</a>';
      }
    })();
  </script>
</body>
</html>
