<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case workspace · FINDETECT</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <dialog id="detail-dialog" class="dialog">
    <div class="dialog-head"><h3 id="dialog-title">Detail</h3><button class="btn btn-ghost btn-icon" id="dialog-close" aria-label="Close">×</button></div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-foot"><button class="btn btn-secondary" id="dialog-ok">Close</button></div>
  </dialog>
  <script type="module" src="assets/case.js"></script>
  <script>
    setTimeout(function () {
      var sidebar = document.getElementById("sidebar");
      var content = document.getElementById("content");
      if (sidebar && !sidebar.children.length && content) {
        content.innerHTML = '<div class="error-state" style="margin:24px"><h3>UI scripts did not load</h3><p>Open <strong>http://127.0.0.1:8000/ui/</strong> (recommended) or run <code>python serve_frontend.py --port 5600</code>. Do not use <code>python -m http.server</code>.</p></div>';
      }
    }, 2000);
  </script>
</body>
</html>
